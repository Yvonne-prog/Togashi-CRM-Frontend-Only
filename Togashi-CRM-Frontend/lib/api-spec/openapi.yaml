components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # Auth schemas
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, firstName, lastName, email, role]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
        department:
          type: ["string", "null"]
        departmentId:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [firstName, lastName, email, role, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
        password:
          type: string
        departmentId:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        departmentId:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean

    ProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        currentPassword:
          type: string
        newPassword:
          type: string

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Organization
    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        legalName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        currency:
          type: string
        timezone:
          type: string
        logoUrl:
          type: ["string", "null"]

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
        legalName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        currency:
          type: string
        timezone:
          type: string

    # Department
    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        managerId:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        memberCount:
          type: integer

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        managerId:
          type: ["string", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        managerId:
          type: ["string", "null"]

    # Dashboard schemas
    DashboardStats:
      type: object
      required: [totalRevenue, revenueThisMonth, activeCustomers, openLeads, activeDeals, pipelineValue, activeProjects, openTasks, overdueTasks, upcomingMeetings]
      properties:
        totalRevenue:
          type: number
        revenueThisMonth:
          type: number
        revenueLastMonth:
          type: number
        activeCustomers:
          type: integer
        openLeads:
          type: integer
        newLeadsThisMonth:
          type: integer
        activeDeals:
          type: integer
        pipelineValue:
          type: number
        activeProjects:
          type: integer
        openTasks:
          type: integer
        overdueTasks:
          type: integer
        upcomingMeetings:
          type: integer

    PipelineStage:
      type: object
      required: [stage, count, value, weightedValue]
      properties:
        stage:
          type: string
        count:
          type: integer
        value:
          type: number
        weightedValue:
          type: number
        probability:
          type: number

    PriorityAction:
      type: object
      required: [id, type, title, priority, dueDate]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        priority:
          type: string
        dueDate:
          type: ["string", "null"]
        relatedRecord:
          type: ["string", "null"]
        relatedId:
          type: ["string", "null"]

    CustomerHealthSummary:
      type: object
      required: [healthy, needsAttention, atRisk]
      properties:
        healthy:
          type: integer
        needsAttention:
          type: integer
        atRisk:
          type: integer

    TeamPerformance:
      type: object
      required: [userId, name, dealsWon, revenue, tasksCompleted, followUps]
      properties:
        userId:
          type: string
        name:
          type: string
        avatar:
          type: ["string", "null"]
        dealsWon:
          type: integer
        revenue:
          type: number
        tasksCompleted:
          type: integer
        followUps:
          type: integer

    # Contact schemas
    Contact:
      type: object
      required: [id, firstName, lastName, email]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        alternativePhone:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        companyId:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        type:
          type: string
        status:
          type: string
        assignedTo:
          type: ["string", "null"]
        assignedToName:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        preferredChannel:
          type: ["string", "null"]
        lastContactedAt:
          type: ["string", "null"]
        nextFollowUpAt:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    ContactDetail:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          properties:
            notes:
              type: ["string", "null"]
            deals:
              type: array
              items:
                $ref: "#/components/schemas/Deal"
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/Task"
            recentActivities:
              type: array
              items:
                $ref: "#/components/schemas/Activity"

    ContactInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        alternativePhone:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        companyId:
          type: ["string", "null"]
        type:
          type: string
        status:
          type: string
        assignedTo:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        preferredChannel:
          type: ["string", "null"]
        nextFollowUpAt:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        tags:
          type: array
