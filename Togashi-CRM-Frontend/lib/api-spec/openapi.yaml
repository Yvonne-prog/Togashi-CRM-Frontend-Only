              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /dashboard/todays-schedule:
    get:
      operationId: getDashboardTodaysSchedule
      tags: [dashboard]
      responses:
        "200":
          description: Today's schedule
          content:
            application/json:
              schema:
                type: array
                items:
